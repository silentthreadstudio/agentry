name: CI

# The correctness net for the pnpm workspace: install (frozen) → build → the plugin structure gate →
# typecheck + tests for ALL packages (core · eval) and the plugin's scripts. Every test is offline (replay/pure — no
# live `claude -p`), so CI never spends API budget.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm (version from the package.json `packageManager` field)
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24" # the memory store uses the built-in node:sqlite (Node ≥ 24)
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (core tsc)
        run: pnpm -r build

      - name: Plugin structure gate
        run: node scripts/check-plugin.mjs

      - name: Typecheck (all packages)
        run: pnpm -r typecheck

      - name: Lint (biome — lint, format, import order)
        run: pnpm lint

      - name: Test (every package + the plugin's script tests)
        run: pnpm test
